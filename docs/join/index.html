<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Margin Knights game</title>
  <meta name="description" content="A friend invited you to their Margin Knights game.">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12121a; color: #e8e8f0;
      font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 440px; padding: 24px; text-align: center; }
    h1 { margin: 0 0 4px; color: #ffd166; font-size: 26px; }
    .code { font: 700 22px ui-monospace, Consolas, monospace; letter-spacing: 4px; color: #ffd166; }
    a.btn { display: inline-block; margin: 14px 0 6px; padding: 10px 18px; border-radius: 8px; background: #3b3216;
      border: 1px solid #7a6526; color: #e8e8f0; text-decoration: none; font-weight: 600; }
    a.btn:hover { border-color: #ffd166; }
    .muted { color: #8b8ba3; font-size: 14px; }
    .muted a { color: #a29bfe; }
  </style>
</head>
<body>
  <main>
    <h1>Margin Knights</h1>
    <p id="msg">A friend invited you to their game <span id="code" class="code"></span></p>
    <a id="open" class="btn" href="#">Open Margin Knights</a>
    <p class="muted">Your game should open by itself. If it doesn't, click the button above.</p>
    <p class="muted">Don't have the game yet? <a href="https://github.com/ViktorNazakov/margin-knights/releases/latest">Download it</a>,
      install it and sign in, then click your friend's invite link again.</p>
  </main>
  <script>
    // ?code=ABCDE&host=ABCD-EFGH  ->  marginknights://join/ABCDE?host=ABCD-EFGH
    const params = new URLSearchParams(location.search);
    const code = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    const host = (params.get('host') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 9);
    if (code.length === 5) {
      const link = 'marginknights://join/' + code + (/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(host) ? '?host=' + host : '');
      document.getElementById('code').textContent = code;
      document.getElementById('open').href = link;
      location.href = link;
    } else {
      document.getElementById('msg').textContent = 'This invite link is missing its game code. Ask your friend for a new one.';
      document.getElementById('open').style.display = 'none';
    }
  </script>
</body>
</html>
